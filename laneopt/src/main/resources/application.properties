spring.application.name=LaneOpt

spring.datasource.url=jdbc:postgresql://localhost:5432/laneopt_db
spring.datasource.username=laneopt
spring.datasource.password=${LANEOPT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8081}